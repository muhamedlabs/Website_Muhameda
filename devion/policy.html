<body class="animsition">
    <div class="vlt-gap-140"></div>
    <div class="container">
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <!--Основной заголовок: подтягивается из выбранного языка-->
                <div class="vlt-animated-block" data-animation-name="fadeInUpSm" style="animation-delay:0s; animation-duration:700ms;">
                    <h3 id="policy-title" data-translate="title">Privacy Policy.</h3>
                </div>
                <div class="vlt-gap-60"></div>
                <!--Контент страницы: весь текст должен быть на одном языке-->
                <div class="vlt-animated-block" data-animation-name="fadeInUpSm" style="animation-delay:.1s; animation-duration:700ms;">
                    <div id="policy-content">
                        <!-- Контент будет загружен через JS и должен быть на одном языке -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="vlt-gap-140"></div>

    <!--Footer: весь текст и кнопки переключения языка должны быть на одном языке, подсказка для разработчиков -->
    <footer class="vlt-footer vlt-footer--default vlt-footer--fixed">
        <div class="vlt-footer-copyright">
            <!--Подтягивается из JSON выбранного языка-->
            <p data-translate="guidelines_copyright">© 2025 Muhamed — All Rights Reserved</p>
        </div>
        <div class="vlt-language-switcher">
            <!--Кнопки переключения языка: остаются как есть, но текст фиксированный-->
            <a href="#" data-lang="en" class="lang-switcher is-active">Eng.</a>
            <a href="#" data-lang="uk" class="lang-switcher">Ukr.</a>
            <a href="#" data-lang="ru" class="lang-switcher">Rus.</a>
        </div>
    </footer>

    <!--Библиотеки JS: без перевода-->
    <script src="assets/vendors/jquery-3.5.1.min.js"></script>
    <script src="assets/scripts/vlt-plugins.min.js"></script>
    <script src="assets/scripts/vlt-helpers.js"></script>
    <script src="assets/scripts/vlt-controllers.min.js"></script>
    <script>
        let translations = {};

        async function loadTranslations() {
            // Загружаем переводы один раз
            if (Object.keys(translations).length === 0) {
                const response = await fetch('assets/language/policy.json');
                translations = await response.json();
            }
            return translations;
        }

        async function setLanguage(lang) {
            const texts = (await loadTranslations())[lang];

            // Обновляем <title>: должно соответствовать выбранному языку
            if (texts.title_ts) document.title = texts.title_ts;

            // Обновляем все элементы с data-translate: текст должен быть на одном языке
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (texts[key]) el.innerHTML = texts[key];
            });

            // Загружаем контент страницы: весь контент на одном языке
            const policyContent = document.getElementById('policy-content');
            if (policyContent) {
                let html = `<p>${texts.content}</p>`;
                for (let key in texts.sections) {
                    html += `<h4>${texts.sections[key].title}</h4><p>${texts.sections[key].content}</p>`;
                }
                policyContent.innerHTML = html;
            }
        }

        // Переключение языков
        document.querySelectorAll('.lang-switcher').forEach(button => {
            button.addEventListener('click', async (event) => {
                event.preventDefault();
                const lang = button.getAttribute('data-lang');
                await setLanguage(lang);
                document.querySelectorAll('.lang-switcher').forEach(btn => btn.classList.remove('is-active'));
                button.classList.add('is-active');
            });
        });

        // Устанавливаем язык по умолчанию
        setLanguage('ru');
    </script>
</body>
